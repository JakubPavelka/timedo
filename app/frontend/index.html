<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Timedo | Čas a úkoly pod kontrolou</title>
        <style>
            html {
                background: #f9fafb;
            }
            html[data-theme='dark'] {
                background: #0f1114;
            }
            #splash {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: grid;
                place-items: center;
                background: #f9fafb;
                transition: opacity 200ms ease;
            }
            [data-theme='dark'] #splash {
                background: #0f1114;
            }
            #splash.splash--hidden {
                opacity: 0;
                pointer-events: none;
            }
            .splash__logo {
                width: 72px;
                height: 72px;
                overflow: visible;
            }
            .splash__logo * {
                transform-box: view-box;
            }
            .splash__body {
                transform-origin: 16.5px 18px;
                animation: splash-press 1.8s ease-in-out infinite;
            }
            .splash__crown {
                animation: splash-crown 1.8s ease-in-out infinite;
            }
            .splash__check {
                stroke-dasharray: 1;
                stroke-dashoffset: 1;
                animation: splash-check 1.8s infinite;
            }
            @keyframes splash-press {
                0%,
                18%,
                100% {
                    transform: scale(1);
                }
                10% {
                    transform: scale(0.96);
                }
            }
            @keyframes splash-crown {
                0%,
                16%,
                100% {
                    transform: translateY(0);
                }
                10% {
                    transform: translateY(1.4px);
                }
            }
            @keyframes splash-check {
                0%,
                14% {
                    stroke-dashoffset: 1;
                    opacity: 1;
                    animation-timing-function: cubic-bezier(0.3, 0, 0.2, 1);
                }
                48%,
                80% {
                    stroke-dashoffset: 0;
                    opacity: 1;
                }
                92% {
                    stroke-dashoffset: 0;
                    opacity: 0;
                }
                100% {
                    stroke-dashoffset: 1;
                    opacity: 0;
                }
            }
            @keyframes splash-pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.4;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .splash__body,
                .splash__crown {
                    animation: none;
                }
                .splash__check {
                    stroke-dashoffset: 0;
                    animation: splash-pulse 1.8s ease-in-out infinite;
                }
            }
        </style>
    </head>
    <body>
        <script>
            (function () {
                let theme = 'light';
                try {
                    const stored = localStorage.getItem('theme');
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if (parsed.state?.theme === 'dark') theme = 'dark';
                    }
                } catch {}
                document.documentElement.dataset.theme = theme;
            })();
        </script>
        <div id="splash" aria-hidden="true">
            <svg
                class="splash__logo"
                viewBox="0 0 33 33"
                fill="none"
                stroke="#fff"
                stroke-linecap="round"
            >
                <g class="splash__body">
                    <rect
                        x="0.5"
                        y="0.5"
                        width="32"
                        height="32"
                        rx="6.4"
                        fill="#3a6491"
                        stroke="none"
                    />
                    <g class="splash__crown">
                        <line
                            x1="13.74"
                            y1="6.51"
                            x2="19.36"
                            y2="6.51"
                            stroke-width="2.06"
                        />
                        <line
                            x1="16.56"
                            y1="6.8"
                            x2="16.56"
                            y2="9.4"
                            stroke-width="1.95"
                            stroke-linecap="butt"
                        />
                    </g>
                    <line
                        x1="22.7"
                        y1="11.75"
                        x2="23.62"
                        y2="10.88"
                        stroke-width="1.95"
                    />
                    <circle cx="16.5" cy="18.061" r="8.429" stroke-width="2.06" />
                    <path
                        class="splash__check"
                        d="M13.58 18.76 L16.25 20.95 L19.42 15.02"
                        pathLength="1"
                        stroke-width="2.06"
                        stroke-linejoin="round"
                    />
                </g>
            </svg>
        </div>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
